# FedAgent verl-0.8 training config (thin overlay) — PRIMARY entry config.
#
# All FedAgent leaf overrides live in fedagent_ppo_body.yaml (layered on verl's STOCK
# `ppo_trainer` via hydra.searchpath -> verl's trainer/config dir, exported as $VERL_CFG by
# the launch script). This file only adds the searchpath declaration, which hydra permits in
# the PRIMARY config alone — that split lets other entry points (fedagent_one_step_off.yaml)
# reuse the body without duplicating it.
defaults:
  - fedagent_ppo_body
  - _self_

hydra:
  searchpath:
    - file://${oc.env:VERL_CFG}
