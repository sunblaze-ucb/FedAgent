# ALFWorld env-het SMOKE: scene_disjoint (content-level, the Catalog-Split analog).
# Each client trains in its own room-type-stratified set of FloorPlans (hidden P_i)
# with a FIXED 100-game shard whose task-type mix matches the global marginal, so
# env_div moves ONLY catalog divergence (never data quantity or the tau marginal).
# env_div=0.0 is the byte-identical homogeneous floor; 1.0 the max-divergence arm.
# Validation stays on the shared unperturbed val service.
# See dev-branch docs/dev_doc/alfworld_env_heterogeneity.md.

env_kind: alfworld
env_spec: config/envs/alfworld.yaml
output_dir: outputs/fedagent_alfworld_scene_disjoint_smoke
model_path: Qwen/Qwen2.5-1.5B-Instruct                  # HF id; offline clusters: --model-path <local snapshot>

total_clients: 2
clients_per_round: 2
total_rounds: 2
epochs_per_round: 1
base_seed: 42

n_gpus_per_node: 4
total_training_steps: 4
save_freq: 4
wait_between_clients: 8

partition_strategy: scene_disjoint
env_div: 1.0                    # 0.0 stable floor -> 1.0 max scene divergence
alfworld_scenes_per_client: 8   # 2 per room type (kitchen/living/bedroom/bath)
min_goals_per_client: 100       # FIXED per-client game count (task-type quota matched)
# alfworld_holdout_file: data/env_heterogeneity/holdout_alfworld_v1.json  # optional OOD reserve
alfworld_pool_size: 16          # >= gen_batch (train_batch_size 8 x rollout.n 2 = 16)
alfworld_base_port: 8200
alfworld_train_eval: train

client_overrides:
  - data.train_batch_size=8     # proven WebShop batch shape on 4 GPUs (divisible by force_group_size*micro_batch)
  - data.max_prompt_length=2048
  - data.max_response_length=4096
  - actor_rollout_ref.actor.ppo_mini_batch_size=8
  - actor_rollout_ref.rollout.n=2
  - actor_rollout_ref.rollout.prompt_length=2048
  - actor_rollout_ref.rollout.response_length=4096
  - actor_rollout_ref.rollout.max_model_len=8192
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.5   # headroom on shared 4-GPU node
