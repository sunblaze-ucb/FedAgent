# ALFWorld VALIDATION env-spec (paired with run_fed val_env_spec). The agent talks to the
# shared UNPERTURBED val service (PARTITION_STRATEGY=uniform). The full ALFWorld eval set is
# 274 trials = valid_seen(140) + valid_unseen(134); a single val service can only draw ONE split
# (alfworld_val_split: eval_in_distribution=valid_seen / eval_out_of_distribution=valid_unseen).
# n_envs=64 == the PAPER's in-loop validation size (original FedAgent val_data_size=64): the first
# 64 valid_seen games, scored the SAME every round -> a clean round->success curve. (The verl-0.8
# migration briefly set this to 140 = ALL of valid_seen; the paper used 64.) For the full per-task-type
# breakdown / final numbers, run tools/verl08_migration/eval_alfworld_by_tasktype.py (valid_seen ONLY
# -- it pins eval_in_distribution; score the other 134 with a separate eval_out_of_distribution pass).
# 50-turn budget matches training.
envs:
  - name: ALFWorld
    n_envs: 64      # PAPER in-loop validation size (original FedAgent val_data_size=64): first 64
                    #   valid_seen games, same fixed set every round. (Migration briefly used 140 = all valid_seen.)
    max_turns: 50   # matches training (original ALFWorld max_steps=50); see alfworld.yaml GPU-VERIFY note
    agent_name: gym_text
    config:
      timeout: 180.0
