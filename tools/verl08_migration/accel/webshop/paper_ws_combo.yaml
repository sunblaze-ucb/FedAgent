# OPTIMAL-COMBO candidate A (Tier-2 + r4 + fused[equiv 1.116e-5]) on the REAL WebShop paper config, 2 rounds.
# change the paper-config per-unit costs" A/B. Identical to paper_ws_grpo15_wiring.yaml (the REAL
# uniform/Qwen2.5-1.5B/main/grpo/webshop config capped at 2 rounds, cross_round/worker) EXCEPT:
# + webshop_replicas=4, pool 16->64 (the Tier-1 WebShop recipe: pool64+r4 = step −12%; both
# perf-only), output_dir -> runs/ (not _scratch), fresh ports. Baseline to beat (old wiring run):
# cold-start + base eval 707s; training round (2 clients x 3 epochs) 496s; n=500 eval 630s.
# WebShop is GPU-bound so expect a modest gen-side trim, not an ALFWorld-scale win.
env_kind: webshop
env_spec: config/envs/webshop_15.yaml
val_env_spec: config/envs/webshop_15_val.yaml
output_dir: /gpfs/projects/b1222/userdata/canyu/kangyu/fedagent/runs/paper_ws/combo
model_path: /projects/b1222/.cache/huggingface/hub/models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/989aa7980e4cf806f80c7fef2b1adb7bc71aa306
total_clients: 100
clients_per_round: 2
total_rounds: 2                                     # WIRING: 70 -> 2
epochs_per_round: 3
base_seed: 42
n_gpus_per_node: 4
total_training_steps: 0                             # full E epochs/round (paper)
save_freq: 100000
test_freq: 5
val_before_train: true
val_temperature: 0.4
wait_between_clients: 8
min_goals_per_client: 100
webshop_pool_size: 64                               # accel: 16 -> 64 (split over 4 replicas, ~18/replica)
webshop_replicas: 4                                 # accel: Tier-1 recipe (perf-only)
webshop_base_port: 10200
webshop_val_port: 10700                             # OUTSIDE the per-client band [10200, 10600) = base + 100 clients x K=4
search_return_n: 50
partition_strategy: ""
service_scope: run                                  # Tier-2b (WS services warm fast; small win)
final_eval_mode: worker                             # Tier-2c
hf_export: final                                    # Tier-2d
cross_round: true                                   # accel path (validated 1.5B); worker eval on hot engine
eval_mode: worker
client_overrides:
  - data.train_batch_size=8
  - data.max_prompt_length=4096
  - data.max_response_length=512
  - actor_rollout_ref.actor.ppo_mini_batch_size=8
  - actor_rollout_ref.rollout.n=8
  - actor_rollout_ref.rollout.prompt_length=4096
  - actor_rollout_ref.rollout.response_length=512
  - actor_rollout_ref.rollout.max_model_len=4608
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.6
  - actor_rollout_ref.model.use_fused_kernels=True
  - actor_rollout_ref.model.fused_kernel_options.impl_backend=triton
  - actor_rollout_ref.actor.checkpoint.save_contents=[model]
