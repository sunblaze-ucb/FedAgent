# WIRING TEST of the REAL ALFWorld paper config + the adopted accel stack — the ALFWorld analog
# of webshop/paper_ws_grpo15_wiring.yaml (first-ever run of the actual paper config on ALFWorld).
# Identical to config/paper/uniform/Qwen2.5-1.5B-Instruct/main/grpo/fed_alfworld_grpo_total-100_
# cl-per-rd-2_rd-70_ep-per-cl-3_min-goals-per-cl-100_p-uniform.yaml EXCEPT: model->local snapshot,
# output_dir->GPFS runs/, total_rounds 70->2 (wiring only), + the adopted accel stack
# (cross_round/worker + alfworld_replicas=8, pool 8->64 so each replica serves ~10 games; both
# perf-only: same client shard, same iid game sampling). Paper geometry kept EXACTLY: windowed
# rollout (default), prompt 2048 / response cap 512 / max_model_len 2560 (gen_paper_configs.py:148
# — NOT the stale 16384/8192 concat comment in config/envs/alfworld.yaml), G=8, 3 epochs/round,
# min_goals 100, 100-client uniform partition, 140-game valid_seen val, val temp 0.4.
# Questions: (a) does the real config wire up end-to-end (partition, G=8 memory at cap 2560,
# 140-game worker eval)? (b) per-unit costs: s/training-round + s/140-game-eval -> 70-round
# feasibility, mirroring the WebShop wiring numbers (707 cold+base-eval / 496 round / 630 eval).
env_kind: alfworld
env_spec: config/envs/alfworld.yaml
val_env_spec: config/envs/alfworld_val.yaml
output_dir: /gpfs/projects/b1222/userdata/canyu/kangyu/fedagent/runs/paper_alf/wiring_r8
model_path: /projects/b1222/.cache/huggingface/hub/models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/989aa7980e4cf806f80c7fef2b1adb7bc71aa306
total_clients: 100
clients_per_round: 2
total_rounds: 2                                     # WIRING: 70 -> 2
epochs_per_round: 3
base_seed: 42
n_gpus_per_node: 4
total_training_steps: 0                             # full E epochs/round (paper)
save_freq: 100000
test_freq: 5
val_before_train: true
val_temperature: 0.4
wait_between_clients: 8
min_goals_per_client: 100
alfworld_pool_size: 64                              # accel: 8 -> 64 (split over 8 replicas, ~10/replica)
alfworld_replicas: 8                                # accel: Tier-1 recipe (perf-only)
alfworld_base_port: 42200
alfworld_val_port: 43100                            # OUTSIDE the per-client band [42200, 43000) = base + 100 clients x K=8
partition_strategy: ""
cross_round: true                                   # accel path (validated 1.5B); worker eval on hot engine
eval_mode: worker
client_overrides:
  - data.train_batch_size=8
  - data.max_prompt_length=2048
  - data.max_response_length=512
  - actor_rollout_ref.actor.ppo_mini_batch_size=8
  - actor_rollout_ref.rollout.n=8
  - actor_rollout_ref.rollout.prompt_length=2048
  - actor_rollout_ref.rollout.response_length=512
  - actor_rollout_ref.rollout.max_model_len=2560
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.6
  - actor_rollout_ref.actor.checkpoint.save_contents=[model]
