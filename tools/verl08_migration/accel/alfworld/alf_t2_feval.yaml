# Tier-2c ARM (final_eval_mode=worker) vs alf_t2_base.yaml: identical except the knob.
# PAPER caps (windowed 2048/512/2560), 48-game val every round, seed 42, cleanup off.
# The cache/scope/feval/all arms diff against this (equivalence: round_2 aggregated actor;
# timing: barrier walls + service-warm/final-eval phases in the log).
env_kind: alfworld
env_spec: config/envs/alfworld.yaml
val_env_spec: /gpfs/projects/b1222/userdata/canyu/kangyu/fedagent/tools/verl08_migration/accel/alfworld_val_48.yaml
output_dir: /gpfs/projects/b1222/userdata/canyu/kangyu/fedagent/runs/t2_alf/feval
model_path: /projects/b1222/.cache/huggingface/hub/models--Qwen--Qwen2.5-1.5B-Instruct/snapshots/989aa7980e4cf806f80c7fef2b1adb7bc71aa306
total_clients: 2
clients_per_round: 2
total_rounds: 2
epochs_per_round: 1
total_training_steps: 1
base_seed: 42
val_before_train: true
val_temperature: 0.4
test_freq: 1
save_freq: 100000
min_goals_per_client: 32
alfworld_pool_size: 64
alfworld_replicas: 8
alfworld_base_port: 42000
alfworld_val_port: 42100
alfworld_val_split: eval_in_distribution
final_eval_mode: worker                             # Tier-2c ARM: model_T scored on the hot engine (no cold subprocess)
cleanup_checkpoints: false
partition_strategy: ""
n_gpus_per_node: 4
eval_mode: worker
cross_round: true
client_overrides:
  - data.train_batch_size=8
  - data.max_prompt_length=2048
  - data.max_response_length=512
  - actor_rollout_ref.actor.ppo_mini_batch_size=8
  - actor_rollout_ref.rollout.n=8
  - actor_rollout_ref.rollout.prompt_length=2048
  - actor_rollout_ref.rollout.response_length=512
  - actor_rollout_ref.rollout.max_model_len=2560
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.6
